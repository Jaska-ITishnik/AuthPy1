<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Parolni tiklash — AuthLab</title>
    <link rel="stylesheet" href="../apps/static/apps/css/auth.css">
</head>
<body>
<main class="shell">
    <section class="visual"><a class="brand" href="login.html"><span class="mark">A</span>AuthLab</a>
        <div class="visual-copy"><span class="eyebrow">Xavfsiz tiklash</span>
            <h1>Hisobga qaytish oson, ammo xavfsiz.</h1>
            <p>Bir martalik token va token muddati tushunchalarini o‘rganing.</p></div>
    </section>
    <section class="auth-side">
        <div class="auth-wrap"><a class="brand mobile-brand" href="login.html"><span class="mark">A</span>AuthLab</a>
            <h2>Parolni tiklash</h2>
            <p class="lead">Emailni kiriting. Demo xabari shu sahifada ko‘rsatiladi.</p>
            <div class="messages" data-message-area hidden></div>
            <form data-message-form="Tiklash havolasi yuborildi (demo).">
                <div class="field"><label for="email">Email manzil</label>
                    <div class="control">
                        <input id="email" name="email" type="email" autocomplete="email"
                               placeholder="student@example.com" required></div>
                </div>
                <button class="btn btn-primary" type="submit">Tiklash havolasini yuborish</button>
            </form>
            <div class="divider">esladingizmi?</div>
            <a class="btn btn-ghost" href="login.html">← Kirish sahifasiga qaytish</a></div>
    </section>
</main>
<script src="../apps/static/apps/js/auth.js"></script>
</body>
</html>
